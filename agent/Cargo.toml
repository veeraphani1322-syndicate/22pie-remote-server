[package]
name = "pie22-remote-agent"
version = "0.1.1"
edition = "2021"
description = "Lightweight authorized-device agent for 22Pie Remote Server"
license = "UNLICENSED"

[[bin]]
name = "22PieRemoteAgent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
directories = "6.0"
dotenvy = "0.15"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }
