[package]
name = "pie22-remote-agent"
version = "0.1.1"
edition = "2021"
description = "Lightweight authorized-device agent for 22Pie Remote Server"
license = "UNLICENSED"

[[bin]]
name = "22PieRemoteAgent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
directories = "6.0"
dotenvy = "0.15"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
bytes = "1.10"
fast_image_resize = "6.1"
openh264 = "0.9"
scrap = "0.5"
webrtc = "0.17"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
