name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/build-windows-agent.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 Windows executable
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    defaults:
      run:
        working-directory: agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Build release executable
        run: |
          cargo fmt --check
          cargo check --locked --target x86_64-pc-windows-msvc
          cargo test --locked --target x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/GraphicService.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable not found: $exe" }
          $llvmReadObj = Get-Command llvm-readobj.exe -ErrorAction Stop
          $imports = & $llvmReadObj.Source --coff-imports $exe
          if ($imports -match "TaskDialogIndirect") {
            throw "The executable has a hard TaskDialogIndirect import"
          }
          Write-Host "Verified: TaskDialogIndirect is not in the executable import table"
          if (($imports -join "`n") -match '(?i)(VCRUNTIME|MSVCP)[0-9_]*\.dll') {
            throw "Executable must not require a separately installed Visual C++ runtime"
          }
          $headers = & $llvmReadObj.Source --file-headers $exe
          $headerText = $headers -join "`n"
          if ($headerText -notmatch "IMAGE_SUBSYSTEM_WINDOWS_CUI") {
            throw "Release executable must use a visible Windows console"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/GraphicService.exe
          $smokeDir = Join-Path $env:RUNNER_TEMP "graphics-services-single-exe"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item $exe (Join-Path $smokeDir "GraphicService.exe")
          Push-Location $smokeDir
          try {
            $version = & .\GraphicService.exe --version
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Graphics Services ') {
              throw "Single-executable startup verification failed"
            }
          } finally { Pop-Location }


      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GraphicService-Windows
          path: agent/dist/GraphicService.exe
          if-no-files-found: error
